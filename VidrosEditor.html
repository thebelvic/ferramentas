<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidros Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Lato',sans-serif;background:#eef3fb;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
#root{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
#hdr{background:linear-gradient(135deg,#0d3d7a 0%,#1a5fa8 100%);padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdr-logo{display:flex;align-items:center;gap:12px;}
.hdr-icon{width:36px;height:36px;background:rgba(255,255,255,0.15);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.hdr-title{color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;letter-spacing:1px;}
.hdr-sub{color:rgba(255,255,255,0.55);font-size:10px;letter-spacing:.5px;}
.hdr-right{display:flex;gap:6px;align-items:center;}
.tab-btn{border:none;border-radius:8px;padding:7px 16px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.5px;transition:all .15s;}
.tab-btn.on{background:#fff;color:#1a5fa8;}
.tab-btn.off{background:rgba(255,255,255,0.13);color:#fff;}
.tab-btn.off:hover{background:rgba(255,255,255,0.22);}
.print-btn{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#e63946,#c1121f);color:#fff;border:none;border-radius:8px;padding:7px 16px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(193,18,31,.3);transition:all .15s;}
.print-btn:hover{transform:translateY(-1px);}
#layout{display:flex;flex:1;overflow:hidden;}
#sidebar{width:230px;flex-shrink:0;background:#fff;border-right:1.5px solid #dde8f5;display:flex;flex-direction:column;overflow:hidden;}
.sb-head{padding:14px 12px 10px;border-bottom:1px solid #dde8f5;}
.sb-title{font-size:10px;font-weight:700;color:#7a90b0;letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;}
.new-btn{width:100%;border:1.5px solid #b0c8e8;border-radius:9px;background:transparent;color:#1a5fa8;padding:8px 12px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;}
.new-btn:hover{background:#e6f1fb;border-color:#1a5fa8;}
.sb-list{flex:1;overflow-y:auto;padding:8px 6px;}
.sb-list::-webkit-scrollbar{width:4px;}
.sb-list::-webkit-scrollbar-track{background:#f7faff;}
.sb-list::-webkit-scrollbar-thumb{background:#b0c8e8;border-radius:2px;}
.proj-item{border-radius:10px;padding:9px 10px;cursor:pointer;margin-bottom:3px;transition:background .15s;position:relative;}
.proj-item:hover{background:#f0f6ff;}
.proj-item.active{background:#e6f1fb;border-left:3px solid #1a5fa8;padding-left:7px;}
.proj-name{font-size:13px;font-weight:700;color:#1a2a40;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Barlow Condensed',sans-serif;}
.proj-sub{font-size:11px;color:#7a90b0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.proj-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#c0c8d8;font-size:15px;opacity:0;transition:opacity .15s;line-height:1;padding:2px;}
.proj-item:hover .proj-del{opacity:1;}
.proj-del:hover{color:#e05c5c;}
.sb-empty{padding:20px 10px;text-align:center;color:#9aacbf;font-size:12px;}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#info-bar{background:#fff;border-bottom:1.5px solid #dde8f5;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-shrink:0;flex-wrap:wrap;}
.lbl{font-size:11px;color:#7a90b0;font-weight:700;letter-spacing:.5px;white-space:nowrap;}
.fi{border:1.5px solid #dde8f5;border-radius:8px;padding:7px 11px;font-size:14px;font-weight:700;color:#1a2a40;background:#f7faff;font-family:'Barlow Condensed',sans-serif;outline:none;transition:border-color .15s;}
.fi:focus{border-color:#1a5fa8;background:#fff;}
.idiv{width:1px;height:30px;background:#dde8f5;flex-shrink:0;}
.stat-lbl{font-size:10px;color:#7a90b0;font-weight:700;text-align:right;}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:21px;color:#1a5fa8;text-align:right;line-height:1;}
.auto-badge{font-size:10px;color:#1a5fa8;background:#e6f1fb;padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;transition:all .3s;}
#content{flex:1;overflow-y:auto;padding:20px;}
#content::-webkit-scrollbar{width:6px;}
#content::-webkit-scrollbar-track{background:#eef3fb;}
#content::-webkit-scrollbar-thumb{background:#b0c8e8;border-radius:3px;}
.edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
.gc{background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(30,80,140,.09);border:1.5px solid #dde8f5;padding:16px 14px 12px;display:flex;flex-direction:column;gap:9px;}
.gc.has-sketch{border-color:#a78bfa;box-shadow:0 2px 12px rgba(109,40,217,.15);}
.gc.gc-porta{border-color:#b0c8e8;border-top:3px solid #1a5fa8;}
.gc-top{display:flex;align-items:center;justify-content:space-between;}
.badge{background:#1a5fa8;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;flex-shrink:0;}
.gc-rm{background:none;border:none;cursor:pointer;color:#c0c8d8;font-size:17px;transition:color .15s;padding:2px 4px;line-height:1;}
.gc-rm:hover{color:#e05c5c;}
.gc-preview{display:flex;justify-content:center;align-items:center;min-height:80px;position:relative;}
.gc-dims{display:flex;gap:7px;}
.gc-lbl{font-size:10px;color:#7a90b0;font-weight:700;letter-spacing:.5px;display:block;margin-bottom:3px;}
.gc-inp{width:100%;border:1.5px solid #dde8f5;border-radius:8px;padding:6px 9px;font-size:13px;font-family:'Barlow Condensed',sans-serif;color:#1a2a40;background:#f7faff;outline:none;transition:border-color .15s;}
.gc-inp:focus{border-color:#1a5fa8;background:#fff;}
.gc-inp optgroup{font-weight:700;color:#7a90b0;font-style:normal;font-size:11px;}
.gc-inp option{font-size:12px;color:#1a2a40;}
.gc-obs-tag{background:#fff5f5;border:1px solid #f5b8b8;border-radius:6px;padding:4px 9px;font-size:10px;color:#c04040;font-weight:700;display:flex;align-items:center;gap:4px;}
.gc-nota-tag{background:#f0f6ff;border:1px solid #b0c8e8;border-radius:6px;padding:4px 9px;font-size:10px;color:#1a5fa8;font-weight:600;display:flex;align-items:center;gap:4px;}

/* sketch button on card */
.sketch-btn{
  width:100%;border:1.5px dashed #a78bfa;border-radius:8px;
  background:rgba(109,40,217,.04);color:#7c3aed;
  padding:6px 10px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:all .15s;
}
.sketch-btn:hover{background:rgba(109,40,217,.09);border-color:#7c3aed;}
.sketch-btn.has{background:rgba(109,40,217,.08);border-style:solid;border-color:#7c3aed;}
.sketch-thumb{width:100%;border-radius:6px;border:1px solid #dde8f5;display:block;background:#f8f5ff;}

.add-card{border:2px dashed #b0c8e8;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-height:220px;color:#6a9fd0;transition:all .15s;background:rgba(26,95,168,.02);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.5px;}
.add-card:hover{background:rgba(26,95,168,.07);border-color:#1a5fa8;color:#1a5fa8;}
.prev-wrap{background:#fff;border-radius:14px;border:1.5px solid #dde8f5;overflow:hidden;}
.prev-hdr{background:linear-gradient(135deg,#0d3d7a 0%,#1a5fa8 100%);padding:20px 28px;display:flex;align-items:center;justify-content:space-between;}
.prev-grid{padding:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
.pc{background:#fff;border-radius:12px;border:1.5px solid #dde8f5;box-shadow:0 2px 10px rgba(30,80,140,.07);padding:13px 9px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;}
.prev-ftr{background:#f7faff;border-top:1.5px solid #dde8f5;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;gap:12px;color:#9aacbf;}

/* ── MODAL NOVO PROJETO ── */
.modal-overlay{position:fixed;inset:0;background:rgba(13,61,122,.35);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal{background:#fff;border-radius:16px;border:1.5px solid #dde8f5;padding:28px 26px;width:340px;box-shadow:0 20px 60px rgba(13,61,122,.2);}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;color:#1a2a40;margin-bottom:20px;letter-spacing:.5px;}
.m-lbl{font-size:11px;color:#7a90b0;font-weight:700;letter-spacing:.5px;display:block;margin-bottom:4px;}
.m-inp{width:100%;border:1.5px solid #dde8f5;border-radius:9px;padding:9px 12px;font-size:14px;font-family:'Barlow Condensed',sans-serif;color:#1a2a40;background:#f7faff;outline:none;margin-bottom:14px;transition:border-color .15s;}
.m-inp:focus{border-color:#1a5fa8;background:#fff;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}
.mbtn{border:1.5px solid #dde8f5;border-radius:9px;padding:8px 18px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;background:transparent;color:#4a6080;transition:all .15s;}
.mbtn:hover{background:#f0f6ff;border-color:#1a5fa8;color:#1a5fa8;}
.mbtn.primary{background:linear-gradient(135deg,#1a5fa8,#0d3d7a);color:#fff;border-color:#1a5fa8;}
.mbtn.primary:hover{opacity:.9;transform:translateY(-1px);}

/* ── SKETCH MODAL ── */
#sketchModal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:2000;align-items:center;justify-content:center;padding:16px;
}
#sketchModal.open{display:flex;}
.sketch-box{
  background:#fff;border-radius:18px;
  box-shadow:0 24px 80px rgba(0,0,0,.35);
  display:flex;flex-direction:column;
  width:min(680px,100%);max-height:95vh;overflow:hidden;
}
.sketch-toolbar{
  padding:12px 16px;
  background:#1a1a2e;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.sketch-toolbar-title{
  color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;
  font-size:16px;letter-spacing:1px;flex:1;
}
.sk-btn{
  background:rgba(255,255,255,.1);border:none;color:#e2e8f0;
  border-radius:7px;padding:6px 12px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;
  display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap;
}
.sk-btn:hover{background:rgba(255,255,255,.2);}
.sk-btn.active{background:#7c3aed;color:#fff;}
.sk-btn.danger{background:rgba(229,57,53,.2);color:#ff6b6b;}
.sk-btn.danger:hover{background:rgba(229,57,53,.4);}
.sk-btn.save{background:#1a5fa8;color:#fff;}
.sk-btn.save:hover{background:#0d3d7a;}
.sk-sep{width:1px;height:24px;background:rgba(255,255,255,.15);flex-shrink:0;}
.sk-color{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:border .15s;}
.sk-color.sel{border-color:#fff;}
.sk-size-wrap{display:flex;align-items:center;gap:5px;}
.sk-size-lbl{color:rgba(255,255,255,.5);font-size:11px;font-weight:600;}
.sk-size{-webkit-appearance:none;width:60px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;cursor:pointer;}
.sk-size::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;cursor:pointer;}

.sketch-hint{
  background:#f8f5ff;padding:7px 16px;
  font-size:11px;color:#7c3aed;font-weight:600;letter-spacing:.3px;
  border-bottom:1px solid #ede9fe;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}
.sketch-hint span{opacity:.7;}

.sketch-canvas-wrap{
  flex:1;overflow:hidden;position:relative;
  background:#f8f8f8;cursor:crosshair;min-height:360px;
}
#sketchCanvas{display:block;touch-action:none;}

.sketch-footer{
  padding:10px 16px;background:#f7faff;border-top:1px solid #dde8f5;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.sketch-dims{font-size:12px;color:#7a90b0;font-weight:600;}
.sketch-footer-btns{display:flex;gap:8px;}
.sfbtn{border:1.5px solid #dde8f5;border-radius:8px;padding:7px 16px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;background:transparent;color:#4a6080;transition:all .15s;}
.sfbtn:hover{background:#f0f6ff;border-color:#1a5fa8;color:#1a5fa8;}
.sfbtn.ok{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:#fff;border-color:#7c3aed;}
.sfbtn.ok:hover{opacity:.9;}

/* ── PRINT ── */
@media print {
  @page{size:A4 portrait;margin:12mm;}
  body,#root{height:auto!important;overflow:visible!important;background:#fff!important;}
  #hdr,#sidebar,#info-bar,.modal-overlay,#sketchModal,.no-print{display:none!important;}
  #layout{display:block!important;}
  #main{display:block!important;overflow:visible!important;}
  #content{overflow:visible!important;padding:0!important;}
  .edit-grid,.add-card{display:none!important;}
  .prev-wrap{border:none!important;border-radius:0!important;box-shadow:none!important;}
  .prev-hdr{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;border-radius:0!important;}
  .prev-grid{grid-template-columns:repeat(5,1fr)!important;gap:8px!important;padding:14px!important;}
  .pc{box-shadow:none!important;border:1px solid #dde8f5!important;break-inside:avoid;page-break-inside:avoid;}
  .prev-ftr{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
}
</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCE5G8Lk3bgocndE1hZSUePvronW1t3SAE",
  authDomain: "brasil-vidros-c7c3a.firebaseapp.com",
  databaseURL: "https://brasil-vidros-c7c3a-default-rtdb.firebaseio.com",
  projectId: "brasil-vidros-c7c3a",
  storageBucket: "brasil-vidros-c7c3a.firebasestorage.app",
  messagingSenderId: "669693663227",
  appId: "1:669693663227:web:22a3bc8110a88c03c35d5e"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
let __st = null;

// Firebase arrays fix
function __fixArrays(d){
  if(d===null||d===undefined||typeof d!=='object'||Array.isArray(d)) return d;
  const keys=Object.keys(d);
  const isArr=keys.length>0&&keys.every(k=>/^\d+$/.test(k))&&
    keys.map(Number).sort((a,b)=>a-b).every((v,i)=>v===i);
  if(isArr){const a=[];keys.map(Number).sort((a,b)=>a-b).forEach(k=>a.push(__fixArrays(d[k])));return a;}
  const o={};for(const k of keys)o[k]=__fixArrays(d[k]);return o;
}
window.__fixArrays=__fixArrays;

// ── SYNC BADGE ──────────────────────────────────────────────────
function __getOrCreateBadge(){
  let el=document.getElementById('fbSync');
  if(!el){
    el=document.createElement('div');
    el.id='fbSync';
    el.style.cssText='position:fixed;bottom:14px;right:14px;font-size:11px;font-weight:600;'+
      'padding:5px 14px;border-radius:20px;pointer-events:none;z-index:9999;'+
      'transition:all .4s;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;gap:6px;';
    document.body.appendChild(el);
  }
  return el;
}

function __showSync(msg, c, bg, persist){
  const el=__getOrCreateBadge();
  el.innerHTML=msg;
  el.style.color=c||'#00e5a0';
  el.style.background=bg||'rgba(0,0,0,.7)';
  el.style.opacity='1';
  clearTimeout(el.__t);
  if(!persist) el.__t=setTimeout(()=>el.style.opacity='0', 3000);
}

// ── OFFLINE DETECTION ──────────────────────────────────────────
function __updateOnlineStatus(){
  if(!navigator.onLine){
    __showSync('📵 Sem internet — salvando localmente','#f5c842','rgba(120,80,0,.85)', true);
  } else {
    // Back online - hide offline badge
    const el=document.getElementById('fbSync');
    if(el&&el.textContent.includes('Sem internet')) el.style.opacity='0';
  }
}

window.addEventListener('online',  ()=>{
  __showSync('✅ Internet reconectada — sincronizando...','#00e5a0','rgba(0,0,0,.7)', false);
  // Trigger a sync if possible
  setTimeout(()=>{ if(window.__syncToCloud) window.__syncToCloud(); }, 500);
});
window.addEventListener('offline', __updateOnlineStatus);
// Check on load
document.addEventListener('DOMContentLoaded', __updateOnlineStatus);

// ── FIREBASE FUNCTIONS ─────────────────────────────────────────
window.__fbSave=function(key,data){
  if(!navigator.onLine){
    __showSync('📵 Sem internet — salvando localmente','#f5c842','rgba(120,80,0,.85)', true);
    return;
  }
  clearTimeout(__st);
  __showSync('☁ sincronizando...','#f5c842','rgba(0,0,0,.7)', false);
  __st=setTimeout(()=>{
    set(ref(db,key),data)
      .then(()=>__showSync('☁ sincronizado','#00e5a0','rgba(0,0,0,.7)', false))
      .catch(e=>{
        console.warn('FB:',e);
        __showSync('⚠ erro ao sincronizar','#ff4d6d','rgba(80,0,0,.8)', false);
      });
  },600);
};

window.__fbLoad=function(key,cb){
  if(!navigator.onLine){ cb(null); return; }
  get(ref(db,key)).then(s=>cb(s.exists()?__fixArrays(s.val()):null)).catch(()=>cb(null));
};

window.__fbListen=function(key,cb){
  onValue(ref(db,key),s=>{ if(s.exists()) cb(__fixArrays(s.val())); });
};

window.__fbReady=true;
window.dispatchEvent(new Event('fbReady'));
</script>
</head>
<body>
<div id="root">
  <div id="hdr">
    <div class="hdr-logo">
      <div class="hdr-icon">🪟</div>
      <div>
        <div class="hdr-title">VIDROS EDITOR</div>
        <div class="hdr-sub">Gestão de folhas de vidro</div>
      </div>
    </div>
    <div class="hdr-right" id="hdr-right"></div>
  </div>
  <div id="layout">
    <div id="sidebar">
      <div class="sb-head">
        <div class="sb-title">Projetos salvos</div>
        <button class="new-btn" onclick="openNewModal()">
          <span style="font-size:18px;line-height:1;margin-top:-1px;">+</span> Novo projeto
        </button>
      </div>
      <div class="sb-list" id="sb-list"></div>
    </div>
    <div id="main">
      <div id="info-bar"></div>
      <div id="content"></div>
    </div>
  </div>
</div>

<!-- ── SKETCH MODAL ── -->
<div id="sketchModal">
  <div class="sketch-box">
    <div class="sketch-toolbar">
      <span class="sketch-toolbar-title">✏️ DESENHAR PEÇA</span>
      <div class="sk-btn active" id="sk-tool-draw" onclick="setTool('draw')" title="Desenhar livre">✏️ Livre</div>
      <div class="sk-btn" id="sk-tool-line" onclick="setTool('line')" title="Linha reta">📏 Reta</div>
      <div class="sk-btn" id="sk-tool-rect" onclick="setTool('rect')" title="Retângulo">▭ Ret.</div>
      <div class="sk-btn" id="sk-tool-tri" onclick="setTool('tri')" title="Triângulo">△ Tri.</div>
      <div class="sk-btn" id="sk-tool-text" onclick="setTool('text')" title="Caixa de texto">T Texto</div>
      <div class="sk-btn" id="sk-tool-move" onclick="setTool('move')" title="Mover/editar texto">✥ Mover</div>
      <div class="sk-btn" onclick="changeFontSize(-2)" title="Diminuir texto" id="sk-txt-minus">A⁻</div>
      <div class="sk-btn" onclick="changeFontSize(+2)" title="Aumentar texto" id="sk-txt-plus">A⁺</div>
      <div class="sk-btn" onclick="rotateSelectedText(-15)" title="Girar -15°">↺</div>
      <div class="sk-btn" onclick="rotateSelectedText(+15)" title="Girar +15°">↻</div>
      <div class="sk-btn danger" onclick="deleteSelectedText()" title="Apagar caixa de texto selecionada">🗑 Txt</div>

<script>
// ══════════════════════════════════════════════
//  GLASS TYPES
// ══════════════════════════════════════════════
const PORTA_TYPES = [
  'Porta de Giro','Porta de Correr','Porta Dupla',
  'Reposição Porta de Giro','Reposição Porta de Correr',
  'Box de Giro','Box de Correr','Porta Camarão','Porta Vai e Vem',
  'Vidro Fixo',
  'Janela 2 Folhas','Janela 4 Folhas','Maxim-Ar',
  'Janela Basculante','Janela Pivotante','Janela Guilhotina',
];

const MODELO_GROUPS = [
  {label:"COMUM",types:["BRONZE 04MM - COMUM","BRONZE 06MM - COMUM","CANELADO 04MM - COMUM","FUMÊ 04MM - COMUM","FUMÊ 05MM - COMUM","FUMÊ 06MM - COMUM","INCOLOR 03MM - COMUM","INCOLOR 04MM - COMUM","INCOLOR 05MM - COMUM","INCOLOR 06MM - COMUM","INCOLOR 08MM - COMUM","INCOLOR 10MM - COMUM","INCOLOR 12MM - COMUM","INCOLOR 15MM - COMUM","INCOLOR 19MM - COMUM","MINI-BOREAL 04MM - COMUM","PONTILHADO 04MM - COMUM","VERDE 04MM - COMUM","VERDE 05MM - COMUM","VERDE 06MM - COMUM","VERDE 08MM - COMUM","VERDE 10MM - COMUM"]},
  {label:"ESPELHO",types:["ESPELHO 04MM - BISOTÊ","ESPELHO 06MM - BISOTÊ","ESPELHO 04MM - LAPIDADO","ESPELHO 06MM - LAPIDADO"]},
  {label:"LAMINADO",types:["LAMINADO 4+4 CHAMPAGNE","LAMINADO FUMÊ 3+3 - LAPIDADO","LAMINADO FUMÊ 4+4 - LAPIDADO","LAMINADO FUMÊ 5+5 - LAPIDADO","LAMINADO INCOLOR 3+3 - LAPIDADO","LAMINADO INCOLOR 4+4 - LAPIDADO","LAMINADO INCOLOR 5+5 - LAPIDADO","LAMINADO VERDE 3+3 - LAPIDADO","LAMINADO VERDE 4+4 - LAPIDADO","LAMINADO VERDE 5+5 - LAPIDADO"]},
  {label:"TEMPERADO",types:["ACIDATO","ANTILOPE 08MM - TEMPERADO","ASTRAL PLUS 08MM - TEMPERADO","AZUL 08MM - TEMPERADO","BOX INCOLOR 08MM - TEMPERADO","BOX VERDE 08MM - TEMPERADO","BRONZE 06MM - TEMPERADO","BRONZE 08MM - TEMPERADO","BRONZE 10MM - TEMPERADO","FUMÊ 06MM - TEMPERADO","FUMÊ 08MM - TEMPERADO","FUMÊ 10MM - TEMPERADO","INCOLOR","INCOLOR 06MM - TEMPERADO","INCOLOR 08MM - TEMPERADO","INCOLOR 10MM - TEMPERADO","INCOLOR 12MM - TEMPERADO","PELE DE VIDRO REFLETIVO","PONTILHADO 08MM - TEMPERADO","PONTILHADO 10MM - TEMPERADO","QUADRATO 08MM - TEMPERADO","VERDE 06MM - TEMPERADO","VERDE 08MM - TEMPERADO"]}
];

const GLASS_GROUPS = MODELO_GROUPS;

function buildModeloOptions(sel){
  let h='<option value="">— Selecione o modelo —</option>';
  MODELO_GROUPS.forEach(g=>{
    h+=`<optgroup label="── ${g.label} ──">`;
    g.types.forEach(t=>h+=`<option value="${t}" ${t===sel?'selected':''}>${t}</option>`);
    h+='</optgroup>';
  });
  return h;
}


function buildSelectOptions(sel){
  let h='<option value="">— Selecione o tipo —</option>';
  const groups=[
    {label:'PORTAS',types:['Porta de Giro','Porta de Correr','Porta Dupla','Reposição Porta de Giro','Reposição Porta de Correr']},
    {label:'BOX / ESPECIAIS',types:['Box de Giro','Box de Correr','Porta Camarão','Porta Vai e Vem']},
    {label:'JANELAS',types:['Janela 2 Folhas','Janela 4 Folhas','Maxim-Ar','Janela Basculante','Janela Pivotante','Janela Guilhotina']},
    {label:'OUTROS',types:['Vidro Fixo']},
  ];
  groups.forEach(g=>{
    h+=`<optgroup label="── ${g.label} ──">`;
    g.types.forEach(t=>h+=`<option value="${t}" ${t===sel?'selected':''}>${t}</option>`);
    h+='</optgroup>';
  });
  return h;
}

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
const STORE='vidros_proj_v5',LAST='vidros_last_v5';
let projects=[],activeId=null,tab='edit',gid=200,saveTimer=null,modal=null;

function loadData(){
  try{const d=localStorage.getItem(STORE);if(d)projects=JSON.parse(d);}catch(e){}
  try{const l=localStorage.getItem(LAST);if(l)activeId=l;}catch(e){}
  if(!projects.length){
    const p=newProject("Renata Amaral","Obra Renata Amaral");
    p.glasses=[
      {id:1,w:645,h:1220,obs:"",nota:"",lado:"",modelo:"",sketch:null},{id:2,w:645,h:955,obs:"",nota:"",lado:"",modelo:"",sketch:null},
      {id:3,w:645,h:1145,obs:"",nota:"",lado:"",modelo:"",sketch:null},{id:4,w:645,h:1155,obs:"",nota:"",lado:"",modelo:"",sketch:null},
      {id:5,w:645,h:1155,obs:"",nota:"",lado:"",modelo:"",sketch:null},{id:6,w:645,h:1110,obs:"",nota:"",lado:"",modelo:"",sketch:null},
      {id:7,w:645,h:1160,obs:"",nota:"",lado:"",modelo:"",sketch:null},{id:8,w:645,h:1135,obs:"",nota:"",lado:"",modelo:"",sketch:null},
      {id:9,w:645,h:1140,obs:"",nota:"",lado:"",modelo:"",sketch:null},{id:10,w:645,h:1135,obs:"",nota:"",lado:"",modelo:"",sketch:null},
      {id:11,w:645,h:1265,obs:"LAMINADO INCOLOR 4+4 - LAPIDADO",nota:"",lado:"",modelo:"",sketch:null},{id:12,w:645,h:1265,obs:"LAMINADO INCOLOR 4+4 - LAPIDADO",nota:"",lado:"",modelo:"",sketch:null},
    ];
    projects.push(p);activeId=p.id;persist();
  }
  if(!activeId||!projects.find(p=>p.id===activeId))activeId=projects[0]?.id||null;
}
function persist(){
  try{localStorage.setItem(STORE,JSON.stringify(projects));localStorage.setItem(LAST,activeId||'');}catch(e){}
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{persist();flashSaved();},500);}
function flashSaved(){
  const el=document.getElementById('auto-badge');if(!el)return;
  el.textContent='✓ salvo';el.style.background='#d4edda';el.style.color='#155724';
  setTimeout(()=>{if(el){el.textContent='auto-save';el.style.background='#e6f1fb';el.style.color='#1a5fa8';}},1800);
}
function newProject(client,obra){return{id:'p'+Date.now()+Math.random().toString(36).slice(2),client:client||'',obra:obra||'',glasses:[],createdAt:Date.now()};}
function active(){return projects.find(p=>p.id===activeId)||null;}
function area(glasses){return glasses.reduce((s,g)=>s+(g.w*g.h)/1e6,0);}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isPortaType(t){return PORTA_TYPES.includes(t);}

// Types that need side-of-opening selector
function needsLadoType(t){
  return['Porta de Giro','Porta de Correr','Porta Dupla','Reposição Porta de Giro','Reposição Porta de Correr',
         'Box de Giro','Box de Correr','Porta Camarão'].includes(t);
}

function doorSVG(tipo, lado){
  const SW=90, SH=110;
  const wallT=10, openingX1=wallT+2, openingX2=SW-wallT-2, openingW=openingX2-openingX1;
  const wallY1=8, wallY2=wallY1+wallT, leafH=3, arcR=openingW;
  const isEsq = lado==='Esquerdo';
  const hx = isEsq?openingX1:openingX2;
  const arcEndX = isEsq?Math.min(openingX1+arcR,SW-2):Math.max(openingX2-arcR,2);
  const arcEndY = wallY2+arcR;
  const sweep = isEsq?0:1;
  const half = openingW/2;
  let content='', label='';

  // ── JANELA 2 FOLHAS ──
  if(tipo==='Janela 2 Folhas'){
    label='2 FOLHAS';
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+20}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+20}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <!-- trilho -->
    <line x1="${openingX1}" y1="${wallY2+2}" x2="${openingX2}" y2="${wallY2+2}" stroke="#9c6b3c" stroke-width="1.5"/>
    <line x1="${openingX1}" y1="${wallY2+6}" x2="${openingX2}" y2="${wallY2+6}" stroke="#9c6b3c" stroke-width="1.5"/>
    <!-- folha esq (frente) -->
    <rect x="${openingX1}" y="${wallY2}" width="${half}" height="${leafH+1}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.5"/>
    <!-- folha dir (fundo) -->
    <rect x="${openingX1+half}" y="${wallY2+3}" width="${half}" height="${leafH}" fill="#e8f4fb" stroke="#6aaed6" stroke-width="1" stroke-dasharray="2,1"/>
    <!-- seta abertura -->
    <path d="M${openingX1+4} ${wallY2+12} L${openingX2-4} ${wallY2+12}" stroke="#1a5fa8" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>
    <line x1="${openingX1}" y1="${wallY2+20}" x2="${openingX2}" y2="${wallY2+20}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── JANELA 4 FOLHAS (2 fixas laterais + 2 móveis centrais) ──
  else if(tipo==='Janela 4 Folhas'){
    label='4 FOLHAS';
    const q=openingW/4; // each leaf width
    // Layout: [FIXA] [MÓVEL→] [←MÓVEL] [FIXA]
    // Fixed panels: left (0) and right (3) — shown with X pattern
    // Mobile panels: center-left (1) and center-right (2) — shown on rail with arrows
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+22}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+22}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>

    <!-- trilho duplo -->
    <line x1="${openingX1}" y1="${wallY2+2}" x2="${openingX2}" y2="${wallY2+2}" stroke="#9c6b3c" stroke-width="1.2"/>
    <line x1="${openingX1}" y1="${wallY2+5}" x2="${openingX2}" y2="${wallY2+5}" stroke="#9c6b3c" stroke-width="1.2"/>

    <!-- FIXA esquerda — vidro fixo com X -->
    <rect x="${openingX1}" y="${wallY2}" width="${q}" height="${leafH+2}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.5"/>
    <line x1="${openingX1+1}" y1="${wallY2+1}" x2="${openingX1+q-1}" y2="${wallY2+leafH+1}" stroke="#6aaed6" stroke-width=".8" opacity=".6"/>
    <line x1="${openingX1+q-1}" y1="${wallY2+1}" x2="${openingX1+1}" y2="${wallY2+leafH+1}" stroke="#6aaed6" stroke-width=".8" opacity=".6"/>
    <text x="${openingX1+q/2}" y="${wallY2+leafH+12}" text-anchor="middle" font-size="6" font-family="Oswald,sans-serif" fill="#4a90d9">F</text>

    <!-- MÓVEL centro-esquerdo — folha no trilho com seta -->
    <rect x="${openingX1+q}" y="${wallY2-1}" width="${q}" height="${leafH+3}" fill="#e8f4fb" stroke="#2a7ac4" stroke-width="1.5"/>
    <path d="M${openingX1+q+q*0.7} ${wallY2+8} L${openingX1+q+q*0.2} ${wallY2+8}" stroke="#1a5fa8" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <text x="${openingX1+q+q/2}" y="${wallY2+leafH+12}" text-anchor="middle" font-size="6" font-family="Oswald,sans-serif" fill="#1a5fa8">M</text>

    <!-- MÓVEL centro-direito — folha no trilho com seta -->
    <rect x="${openingX1+q*2}" y="${wallY2-1}" width="${q}" height="${leafH+3}" fill="#e8f4fb" stroke="#2a7ac4" stroke-width="1.5"/>
    <path d="M${openingX1+q*2+q*0.3} ${wallY2+8} L${openingX1+q*2+q*0.8} ${wallY2+8}" stroke="#1a5fa8" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <text x="${openingX1+q*2+q/2}" y="${wallY2+leafH+12}" text-anchor="middle" font-size="6" font-family="Oswald,sans-serif" fill="#1a5fa8">M</text>

    <!-- FIXA direita — vidro fixo com X -->
    <rect x="${openingX1+q*3}" y="${wallY2}" width="${q}" height="${leafH+2}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.5"/>
    <line x1="${openingX1+q*3+1}" y1="${wallY2+1}" x2="${openingX1+q*4-1}" y2="${wallY2+leafH+1}" stroke="#6aaed6" stroke-width=".8" opacity=".6"/>
    <line x1="${openingX1+q*4-1}" y1="${wallY2+1}" x2="${openingX1+q*3+1}" y2="${wallY2+leafH+1}" stroke="#6aaed6" stroke-width=".8" opacity=".6"/>
    <text x="${openingX1+q*3+q/2}" y="${wallY2+leafH+12}" text-anchor="middle" font-size="6" font-family="Oswald,sans-serif" fill="#4a90d9">F</text>

    <!-- legenda -->
    <text x="${openingX1}" y="${wallY2+22}" font-size="5.5" font-family="Oswald,sans-serif" fill="#94a3b8">F=Fixo  M=Móvel</text>

    <line x1="0" y1="${wallY2+28}" x2="${SW}" y2="${wallY2+28}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── MAXIM-AR ──
  else if(tipo==='Maxim-Ar'){
    label='MAXIM-AR';
    const pivY=wallY2+leafH/2;
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+30}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+30}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <!-- frame -->
    <rect x="${openingX1}" y="${wallY2}" width="${openingW}" height="${leafH*2}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.5"/>
    <!-- pivot line -->
    <line x1="${openingX1}" y1="${pivY}" x2="${openingX2}" y2="${pivY}" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- top opens out -->
    <path d="M${openingX1+2} ${wallY2} Q${openingX1+openingW/2} ${wallY2-14} ${openingX2-2} ${wallY2}" fill="rgba(26,95,168,.07)" stroke="#1a5fa8" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- pivot markers -->
    <circle cx="${openingX1}" cy="${pivY}" r="2" fill="#9c6b3c"/>
    <circle cx="${openingX2}" cy="${pivY}" r="2" fill="#9c6b3c"/>
    <line x1="${openingX1}" y1="${wallY2+leafH*2+10}" x2="${openingX2}" y2="${wallY2+leafH*2+10}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── JANELA BASCULANTE ──
  else if(tipo==='Janela Basculante'){
    label='BASCULANTE';
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+28}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+28}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <!-- folha -->
    <rect x="${openingX1}" y="${wallY2}" width="${openingW}" height="${leafH}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.5"/>
    <!-- parte de baixo abre para dentro -->
    <path d="M${openingX1+2} ${wallY2+leafH} Q${openingX1+openingW/2} ${wallY2+leafH+18} ${openingX2-2} ${wallY2+leafH}" fill="rgba(26,95,168,.06)" stroke="#1a5fa8" stroke-width="1" stroke-dasharray="3,2"/>
    <!-- pivot markers topo -->
    <circle cx="${openingX1}" cy="${wallY2+leafH/2}" r="2" fill="#9c6b3c"/>
    <circle cx="${openingX2}" cy="${wallY2+leafH/2}" r="2" fill="#9c6b3c"/>
    <line x1="${openingX1}" y1="${wallY2+leafH+24}" x2="${openingX2}" y2="${wallY2+leafH+24}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── JANELA PIVOTANTE ──
  else if(tipo==='Janela Pivotante'){
    label='PIVOTANTE';
    const pivX=openingX1+openingW/2;
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+28}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+28}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1}" y="${wallY2}" width="${half-1}" height="${leafH}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.2"/>
    <rect x="${pivX+1}" y="${wallY2}" width="${half-1}" height="${leafH}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.2"/>
    <circle cx="${pivX}" cy="${wallY2+leafH/2}" r="2.5" fill="#c8902a" stroke="#7a5230" stroke-width=".8"/>
    <path d="M${openingX1} ${wallY2+leafH} A${half} ${half} 0 0 1 ${pivX} ${wallY2+leafH+half}" fill="rgba(26,95,168,.05)" stroke="#1a5fa8" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M${openingX2} ${wallY2+leafH} A${half} ${half} 0 0 0 ${pivX} ${wallY2+leafH+half}" fill="rgba(26,95,168,.05)" stroke="#1a5fa8" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="${openingX1}" y1="${wallY2+leafH+half+6}" x2="${openingX2}" y2="${wallY2+leafH+half+6}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── JANELA GUILHOTINA ──
  else if(tipo==='Janela Guilhotina'){
    label='GUILHOTINA';
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+28}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+28}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <!-- guias laterais -->
    <line x1="${openingX1}" y1="${wallY2}" x2="${openingX1}" y2="${wallY2+24}" stroke="#9c6b3c" stroke-width="1.5"/>
    <line x1="${openingX2}" y1="${wallY2}" x2="${openingX2}" y2="${wallY2+24}" stroke="#9c6b3c" stroke-width="1.5"/>
    <!-- folha inferior (frente) -->
    <rect x="${openingX1+1}" y="${wallY2+10}" width="${openingW-2}" height="${leafH+1}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.5"/>
    <!-- folha superior (fundo, tracejada) -->
    <rect x="${openingX1+1}" y="${wallY2}" width="${openingW-2}" height="${leafH}" fill="#e8f4fb" stroke="#6aaed6" stroke-width="1" stroke-dasharray="2,1"/>
    <!-- seta subir -->
    <path d="M${openingX1+openingW/2} ${wallY2+16} L${openingX1+openingW/2} ${wallY2+4}" stroke="#1a5fa8" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="${openingX1}" y1="${wallY2+26}" x2="${openingX2}" y2="${wallY2+26}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── BOX DE GIRO ──
  else if(tipo==='Box de Giro'){
    label='BOX GIRO';
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <line x1="4" y1="${wallY1}" x2="${wallT+6}" y2="${wallY2}" stroke="#9c8a7a" stroke-width=".5"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1}" y="${wallY2}" width="${openingW}" height="${leafH}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.5"/>
    <circle cx="${hx}" cy="${wallY2+leafH/2}" r="2" fill="#9c6b3c" stroke="#5c3d1e" stroke-width=".5"/>
    <path d="M${hx} ${wallY2+leafH} A${arcR} ${arcR} 0 0 ${sweep} ${arcEndX} ${arcEndY}" fill="rgba(26,95,168,.07)" stroke="#1a5fa8" stroke-width="1.2" stroke-dasharray="4,2.5"/>
    <line x1="${hx}" y1="${wallY2+leafH}" x2="${hx}" y2="${arcEndY}" stroke="#1a5fa8" stroke-width="1" stroke-dasharray="3,2" opacity=".5"/>
    <line x1="0" y1="${arcEndY+6}" x2="${SW}" y2="${arcEndY+6}" stroke="#5c3d1e" stroke-width="1.5"/>
    ${lado?`<text x="${isEsq?openingX1+4:openingX2-4}" y="${wallY2+leafH+12}" text-anchor="${isEsq?'start':'end'}" font-size="7" font-family="Oswald,sans-serif" fill="#1a5fa8" font-weight="600">${isEsq?'⬅ ESQ':'DIR ➡'}</text>`:''}`;
  }
  // ── BOX DE CORRER ──
  else if(tipo==='Box de Correr'){
    label='BOX CORRER';
    const pocketW=openingW*0.5;
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1}" y="${wallY1}" width="${pocketW}" height="${wallT}" fill="#e8e0d5" stroke="#9c6b3c" stroke-width=".8" stroke-dasharray="2,2"/>
    <line x1="${openingX1}" y1="${wallY2+6}" x2="${openingX2}" y2="${wallY2+6}" stroke="#4a90d9" stroke-width="1.5"/>
    <rect x="${openingX1+pocketW-2}" y="${wallY1+1}" width="${openingW-pocketW+2}" height="${wallT-2}" fill="#d8edf8" stroke="#4a90d9" stroke-width="1.2"/>
    <line x1="0" y1="${wallY2+14}" x2="${SW}" y2="${wallY2+14}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── PORTA CAMARÃO ──
  else if(tipo==='Porta Camarão'||tipo==='Porta Vai e Vem'){
    label=tipo==='Porta Camarão'?'CAMARÃO':'VAI E VEM';
    const arcR2=openingW*0.55;
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <!-- folha -->
    <rect x="${openingX1}" y="${wallY2}" width="${openingW}" height="${leafH}" fill="#f0e6d3" stroke="#7a5230" stroke-width="1.5"/>
    <!-- pivot center -->
    <circle cx="${openingX1+openingW/2}" cy="${wallY2+leafH/2}" r="2.5" fill="#c8902a"/>
    <!-- swing front -->
    <path d="M${openingX1} ${wallY2+leafH} A${arcR2} ${arcR2} 0 0 1 ${openingX2} ${wallY2+leafH}" fill="rgba(200,144,42,.08)" stroke="#c8902a" stroke-width="1.2" stroke-dasharray="4,2.5"/>
    <!-- swing back -->
    <path d="M${openingX1} ${wallY2} A${arcR2} ${arcR2} 0 0 0 ${openingX2} ${wallY2}" fill="rgba(200,144,42,.05)" stroke="#c8902a" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="0" y1="${wallY2+arcR2+8}" x2="${SW}" y2="${wallY2+arcR2+8}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── VIDRO FIXO ──
  else if(tipo==='Vidro Fixo'){
    label='FIXO';
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1}" y="${wallY2}" width="${openingW}" height="${leafH*2}" fill="#d8edf8" stroke="#6aacda" stroke-width="1.5"/>
    <line x1="${openingX1}" y1="${wallY2+1}" x2="${openingX2}" y2="${wallY2+leafH*2-1}" stroke="#6aacda" stroke-width=".5" opacity=".4"/>
    <line x1="${openingX2}" y1="${wallY2+1}" x2="${openingX1}" y2="${wallY2+leafH*2-1}" stroke="#6aacda" stroke-width=".5" opacity=".4"/>
    <line x1="0" y1="${wallY2+leafH*2+8}" x2="${SW}" y2="${wallY2+leafH*2+8}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── PORTA DUPLA ──
  else if(tipo==='Porta Dupla'){
    label='DUPLA';
    const arc1end=openingX1+half, arc2end=openingX2-half;
    content=`
    <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
    <rect x="${openingX1}" y="${wallY2}" width="${half}" height="${leafH}" fill="#f0e6d3" stroke="#7a5230" stroke-width="1.2"/>
    <rect x="${openingX1+half}" y="${wallY2}" width="${half}" height="${leafH}" fill="#f0e6d3" stroke="#7a5230" stroke-width="1.2"/>
    <path d="M${openingX1} ${wallY2+leafH} A${half} ${half} 0 0 1 ${arc1end} ${wallY2+leafH+half}" fill="rgba(26,95,168,.06)" stroke="#1a5fa8" stroke-width="1" stroke-dasharray="3,2"/>
    <path d="M${openingX2} ${wallY2+leafH} A${half} ${half} 0 0 0 ${arc2end} ${wallY2+leafH+half}" fill="rgba(26,95,168,.06)" stroke="#1a5fa8" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="${openingX1}" cy="${wallY2+2}" r="1.5" fill="#9c6b3c"/>
    <circle cx="${openingX2}" cy="${wallY2+2}" r="1.5" fill="#9c6b3c"/>
    <line x1="0" y1="${wallY2+half+10}" x2="${SW}" y2="${wallY2+half+10}" stroke="#5c3d1e" stroke-width="1.5"/>`;
  }
  // ── PORTA CORRER (default) ──
  else {
    // swing door (Porta de Giro / reposições)
    label=tipo&&tipo.toLowerCase().includes('correr')?'CORRER':'GIRO';
    const isCorrer=tipo&&tipo.toLowerCase().includes('correr');
    if(isCorrer){
      const pocketW=openingW*0.5;
      content=`
      <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
      <rect x="${openingX1}" y="${wallY1}" width="${pocketW}" height="${wallT}" fill="#e8e0d5" stroke="#9c6b3c" stroke-width=".8" stroke-dasharray="2,2"/>
      <line x1="${openingX1}" y1="${wallY2+6}" x2="${openingX2}" y2="${wallY2+6}" stroke="#9c6b3c" stroke-width="1.5"/>
      <rect x="${openingX1+pocketW-2}" y="${wallY1+1}" width="${openingW-pocketW+2}" height="${wallT-2}" fill="#f0e6d3" stroke="#7a5230" stroke-width="1.2"/>
      <line x1="0" y1="${wallY2+14}" x2="${SW}" y2="${wallY2+14}" stroke="#5c3d1e" stroke-width="1.5"/>`;
    } else {
      content=`
      <rect x="0" y="${wallY1}" width="${SW}" height="${wallT}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
      <line x1="4" y1="${wallY1}" x2="${wallT+6}" y2="${wallY2}" stroke="#9c8a7a" stroke-width=".5"/>
      <line x1="10" y1="${wallY1}" x2="${wallT+12}" y2="${wallY2}" stroke="#9c8a7a" stroke-width=".5"/>
      <rect x="${openingX1-wallT}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
      <rect x="${openingX2}" y="${wallY1}" width="${wallT}" height="${wallT+4}" fill="#d8cfc4" stroke="#5c3d1e" stroke-width="1"/>
      <rect x="${openingX1}" y="${wallY2}" width="${openingW}" height="${leafH}" fill="#f0e6d3" stroke="#7a5230" stroke-width="1.5"/>
      <circle cx="${hx}" cy="${wallY2+leafH/2}" r="2" fill="#9c6b3c" stroke="#5c3d1e" stroke-width=".5"/>
      <path d="M${hx} ${wallY2+leafH} A${arcR} ${arcR} 0 0 ${sweep} ${arcEndX} ${arcEndY}" fill="rgba(26,95,168,.07)" stroke="#1a5fa8" stroke-width="1.2" stroke-dasharray="4,2.5"/>
      <line x1="${hx}" y1="${wallY2+leafH}" x2="${hx}" y2="${arcEndY}" stroke="#1a5fa8" stroke-width="1" stroke-dasharray="3,2" opacity=".5"/>
      <line x1="0" y1="${arcEndY+6}" x2="${SW}" y2="${arcEndY+6}" stroke="#5c3d1e" stroke-width="1.5"/>
      ${lado?`<text x="${isEsq?openingX1+4:openingX2-4}" y="${wallY2+leafH+12}" text-anchor="${isEsq?'start':'end'}" font-size="7" font-family="Oswald,sans-serif" fill="#1a5fa8" font-weight="600">${isEsq?'⬅ ESQ':'DIR ➡'}</text>`:''}`;
    }
  }

  return `<svg width="${SW}" height="${SH}" viewBox="0 0 ${SW} ${SH}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto">
        <path d="M0,0 L5,2.5 L0,5 Z" fill="#1a5fa8"/>
      </marker>
    </defs>
    <text x="${SW-2}" y="7" text-anchor="end" font-size="6" font-family="Oswald,sans-serif" fill="#9c6b3c" opacity=".6">PLANTA</text>
    ${content}
    ${label?`<text x="${SW/2}" y="${SH-2}" text-anchor="middle" font-size="7" font-family="Oswald,sans-serif" fill="#5c3d1e" font-weight="700">${label}</text>`:''}
  </svg>`;
}


function glassSVG(w,h,pw){
  const r=h/Math.max(w,1),ph=Math.max(40,Math.min(110,Math.round(pw*r)));
  return `<svg width="${pw}" height="${ph}" viewBox="0 0 ${pw} ${ph}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gg${pw}" x1="0" y1="0" x2="1" y2="1"><stop offset="60%" stop-color="#d8edf8"/><stop offset="100%" stop-color="#b8d8ef"/></linearGradient></defs><rect x="3" y="3" width="${pw-3}" height="${ph-3}" fill="#b8cfe0" rx="2"/><rect width="${pw-3}" height="${ph-3}" fill="url(#gg${pw})" stroke="#6aacda" stroke-width="2" rx="2"/><polygon points="2,2 16,2 2,24" fill="rgba(255,255,255,0.45)"/></svg>`;
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function renderAll(){renderHdr();renderSB();renderInfoBar();renderContent();}

function renderHdr(){
  const p=active();
  document.getElementById('hdr-right').innerHTML=`
    <button class="tab-btn ${tab==='edit'?'on':'off'}" onclick="setTab('edit')">✏️ Editar</button>
    <button class="tab-btn ${tab==='preview'?'on':'off'}" onclick="setTab('preview')">👁️ Visualizar</button>
    ${tab==='preview'&&p?`<button class="print-btn no-print" onclick="window.print()">🖨️ Imprimir / PDF</button>`:''}
  `;
}
function renderSB(){
  const el=document.getElementById('sb-list');
  if(!projects.length){el.innerHTML=`<div class="sb-empty">Nenhum projeto ainda.<br>Crie o primeiro acima.</div>`;return;}
  el.innerHTML=projects.map(p=>`
    <div class="proj-item ${p.id===activeId?'active':''}" onclick="selectProj('${p.id}')">
      <div class="proj-name">${esc(p.client)||'Sem nome'}</div>
      <div class="proj-sub">${esc(p.obra)||'Sem obra'}</div>
      <button class="proj-del" onclick="delProj(event,'${p.id}')" title="Excluir">✕</button>
    </div>`).join('');
}
function renderInfoBar(){
  const p=active(),el=document.getElementById('info-bar');
  if(!p){el.innerHTML='';return;}
  const a=area(p.glasses);
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;"><span class="lbl">CLIENTE</span>
      <input class="fi" style="width:180px;" value="${esc(p.client)}" oninput="updField('client',this.value)" placeholder="Nome do cliente">
    </div>
    <div class="idiv"></div>
    <div style="display:flex;align-items:center;gap:8px;"><span class="lbl">OBRA</span>
      <input class="fi" style="width:230px;" value="${esc(p.obra)}" oninput="updField('obra',this.value)" placeholder="Nome da obra">
    </div>
    <div style="margin-left:auto;display:flex;gap:14px;align-items:center;">
      <span class="auto-badge" id="auto-badge">auto-save</span>
      <div><div class="stat-lbl">VIDROS</div><div class="stat-val">${p.glasses.length}</div></div>
      <div class="idiv"></div>
      <div><div class="stat-lbl">ÁREA TOTAL</div><div class="stat-val">${a.toFixed(3)} m²</div></div>
    </div>`;
}
function renderContent(){
  const p=active(),el=document.getElementById('content');
  if(!p){
    el.innerHTML=`<div class="empty"><svg width="64" height="64" viewBox="0 0 64 64" fill="none"><rect x="8" y="8" width="48" height="48" rx="4" stroke="#9aacbf" stroke-width="2"/><line x1="8" y1="32" x2="56" y2="32" stroke="#9aacbf" stroke-width="2"/><line x1="32" y1="8" x2="32" y2="56" stroke="#9aacbf" stroke-width="2"/></svg>
      <div style="font-size:15px;font-weight:700;font-family:'Barlow Condensed',sans-serif;color:#7a90b0;">Selecione ou crie um projeto</div>
      <div style="font-size:12px;color:#9aacbf;">Use a barra lateral para navegar entre projetos</div></div>`;return;
  }
  el.innerHTML=tab==='edit'?buildEdit(p):buildPreview(p);
}

function buildEdit(p){
  return`<div class="edit-grid">
    ${p.glasses.map((g,i)=>{
      const isPorta=isPortaType(g.obs);
      const needsLado=isPorta&&g.obs!=='Vidro Fixo';
      return`
      <div class="gc${g.sketch?' has-sketch':''}${isPorta?' gc-porta':''}">
        <div class="gc-top"><div class="badge">${i+1}</div><button class="gc-rm" onclick="rmGlass('${p.id}',${g.id})">✕</button></div>

        <!-- PREVIEW -->
        <div class="gc-preview">
          ${g.sketch
            ? `<img class="sketch-thumb" src="${g.sketch}" style="width:100%;max-height:160px;object-fit:contain;border-radius:6px;border:1px solid #ede9fe;" alt="Esboço">`
            : isPorta ? doorSVG(g.obs,g.lado) : glassSVG(g.w,g.h,60)
          }
        </div>

        <!-- DIMS: only for non-porta -->
        ${!isPorta&&!g.sketch?`<div class="gc-dims">
          <label style="flex:1;"><span class="gc-lbl">LARGURA (mm)</span>
            <input class="gc-inp" type="number" value="${g.w}" oninput="updGlass('${p.id}',${g.id},'w',+this.value)">
          </label>
          <label style="flex:1;"><span class="gc-lbl">ALTURA (mm)</span>
            <input class="gc-inp" type="number" value="${g.h}" oninput="updGlass('${p.id}',${g.id},'h',+this.value)">
          </label>
        </div>`:''}

        <!-- TIPO (porta types only) -->
        <label><span class="gc-lbl">TIPO</span>
          <select class="gc-inp" style="cursor:pointer;" onchange="updGlass('${p.id}',${g.id},'obs',this.value)">
            ${buildSelectOptions(g.obs)}
          </select>
        </label>
        ${g.obs?`<div class="gc-obs-tag"><span>🚪</span>${g.obs}</div>`:''}

        <!-- LADO: only for porta types that are NOT vidro fixo -->
        ${needsLado?`
        <label><span class="gc-lbl">LADO DE ABERTURA</span>
          <select class="gc-inp" style="cursor:pointer;" onchange="updGlass('${p.id}',${g.id},'lado',this.value)">
            <option value="" ${!g.lado?'selected':''}>— Selecione o lado —</option>
            <option value="Direito" ${g.lado==='Direito'?'selected':''}>→ Direito</option>
            <option value="Esquerdo" ${g.lado==='Esquerdo'?'selected':''}>← Esquerdo</option>
          </select>
        </label>
        ${g.lado?`<div style="background:${g.lado==='Direito'?'#e8f5e9':'#e3f2fd'};border:1px solid ${g.lado==='Direito'?'#a5d6a7':'#90caf9'};border-radius:6px;padding:4px 9px;font-size:10px;font-weight:700;color:${g.lado==='Direito'?'#2e7d32':'#1565c0'};display:flex;align-items:center;gap:4px;">${g.lado==='Direito'?'→':'←'} Abertura ${g.lado}</div>`:''}`:''}

        <!-- MODELO: for all porta types -->
        ${isPorta?`
        <label><span class="gc-lbl">MODELO DO VIDRO</span>
          <select class="gc-inp" style="cursor:pointer;" onchange="updGlass('${p.id}',${g.id},'modelo',this.value)">
            ${buildModeloOptions(g.modelo)}
          </select>
        </label>
        ${g.modelo?`<div style="background:#f0f6ff;border:1px solid #b0c8e8;border-radius:6px;padding:4px 9px;font-size:10px;font-weight:700;color:#1a5fa8;display:flex;align-items:center;gap:4px;">🪟 ${esc(g.modelo)}</div>`:''}`:''}

        <!-- DIMS for porta too (largura/altura vão) -->
        ${isPorta?`<div class="gc-dims">
          <label style="flex:1;"><span class="gc-lbl">LARG. VÃO (mm)</span>
            <input class="gc-inp" type="number" value="${g.w}" oninput="updGlass('${p.id}',${g.id},'w',+this.value)">
          </label>
          <label style="flex:1;"><span class="gc-lbl">ALT. VÃO (mm)</span>
            <input class="gc-inp" type="number" value="${g.h}" oninput="updGlass('${p.id}',${g.id},'h',+this.value)">
          </label>
        </div>`:''}

        <!-- OBSERVAÇÃO -->
        <label><span class="gc-lbl">OBSERVAÇÃO</span>
          <input class="gc-inp" type="text" value="${esc(g.nota||'')}" placeholder="${isPorta?'Ex: cor, acabamento, medida especial…':'Ex: recorte, furo, chanfro…'}" oninput="updGlass('${p.id}',${g.id},'nota',this.value)">
        </label>
        ${g.nota?`<div class="gc-nota-tag"><span>📝</span>${esc(g.nota)}</div>`:''}

        <!-- SKETCH -->
        <button class="sketch-btn ${g.sketch?'has':''}" onclick="openSketch('${p.id}',${g.id},${g.w},${g.h})">
          ${g.sketch?'✏️ Editar desenho':'✏️ Desenhar forma especial'}
        </button>
        ${g.sketch?`<button class="gc-inp" style="cursor:pointer;background:#fff5f5;border-color:#f5b8b8;color:#c04040;font-size:11px;padding:4px 8px;" onclick="clearSketch('${p.id}',${g.id})">🗑 Remover desenho</button>`:''}
      </div>`;
    }).join('')}
    <div class="add-card" onclick="addGlass('${p.id}')">
      <span style="font-size:34px;line-height:1;">＋</span>
      <span>Adicionar peça</span>
    </div>
  </div>`;
}


function buildPreview(p){
  const a=area(p.glasses);
  return`<div class="prev-wrap">
    <div class="prev-hdr">
      <div><div style="color:rgba(255,255,255,.55);font-size:11px;letter-spacing:1px;font-weight:700;">OBRA</div>
        <div style="color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;letter-spacing:.5px;">${esc(p.obra)||'—'}</div>
      </div>
      <div style="text-align:right;"><div style="color:rgba(255,255,255,.55);font-size:11px;letter-spacing:1px;font-weight:700;">CLIENTE</div>
        <div style="color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:26px;letter-spacing:.5px;">${esc(p.client)||'—'}</div>
      </div>
    </div>
    <div class="prev-grid">
      ${p.glasses.map((g,i)=>{
        const r=g.h/Math.max(g.w,1),pw=75,ph=Math.max(42,Math.min(120,Math.round(pw*r)));
        const hStr=g.h>=1000?(g.h/1000).toFixed(3):String(g.h);
        return`<div class="pc">
          <div class="badge" style="width:28px;height:28px;font-size:14px;">${i+1}</div>
          ${g.sketch
            ? `<img src="${g.sketch}" style="width:${pw}px;max-height:${ph+20}px;object-fit:contain;border-radius:4px;border:1px solid #ede9fe;" alt="Esboço">`
            : isPortaType(g.obs) ? `<div style="padding:4px 0;">${doorSVG(g.obs,g.lado)}</div>`
            : `<div style="display:flex;align-items:flex-start;gap:5px;">
                ${glassSVG(g.w,g.h,pw)}
                <div style="display:flex;flex-direction:column;align-items:center;height:${ph}px;justify-content:center;">
                  <div style="width:1px;flex:1;background:#1a5fa8;"></div>
                  <span style="font-size:10px;color:#1a5fa8;font-weight:700;white-space:nowrap;padding:1px 0;">${hStr}</span>
                  <div style="width:1px;flex:1;background:#1a5fa8;"></div>
                </div>
              </div>`
          }
          ${isPortaType(g.obs)?`

//  SKETCH ENGINE
// ══════════════════════════════════════════════
let skPid=null,skGid=null,skW=0,skH=0;
let skTool='draw',skColor='#1a5fa8',skSize=3;
let skDrawing=false,skStartX=0,skStartY=0,skSnapshot=null;
let skHistory=[];
let skTexts=[],skSelectedTxt=null,skTxtCnt=0;

const skModal=document.getElementById('sketchModal');
const skCanvas=document.getElementById('sketchCanvas');
const skCtx=skCanvas.getContext('2d');
const skTextLayer=document.getElementById('skTextLayer');

// ── GRID on separate canvas ────────────────────────────────────────
let skGridCanvas=null;

function ensureGridCanvas(){
  if(skGridCanvas)return;
  skGridCanvas=document.createElement('canvas');
  skGridCanvas.style.cssText='position:absolute;inset:0;pointer-events:none;';
  document.getElementById('skCanvasWrap').appendChild(skGridCanvas);
}

function drawGrid(){
  ensureGridCanvas();
  skGridCanvas.width=skCanvas.width;
  skGridCanvas.height=skCanvas.height;
  const gc=skGridCanvas.getContext('2d');
  const step=getGridStep();
  gc.clearRect(0,0,skGridCanvas.width,skGridCanvas.height);
  if(!step)return;
  gc.strokeStyle='rgba(100,140,200,.18)';gc.lineWidth=.6;
  for(let x=0;x<=skGridCanvas.width;x+=step){gc.beginPath();gc.moveTo(x,0);gc.lineTo(x,skGridCanvas.height);gc.stroke();}
  for(let y=0;y<=skGridCanvas.height;y+=step){gc.beginPath();gc.moveTo(0,y);gc.lineTo(skGridCanvas.width,y);gc.stroke();}
  const major=step*5;
  gc.strokeStyle='rgba(80,120,180,.35)';gc.lineWidth=1;
  for(let x=0;x<=skGridCanvas.width;x+=major){gc.beginPath();gc.moveTo(x,0);gc.lineTo(x,skGridCanvas.height);gc.stroke();}
  for(let y=0;y<=skGridCanvas.height;y+=major){gc.beginPath();gc.moveTo(0,y);gc.lineTo(skGridCanvas.width,y);gc.stroke();}
  gc.fillStyle='rgba(80,120,180,.45)';gc.font='9px sans-serif';gc.textAlign='left';
  for(let x=major;x<skGridCanvas.width;x+=major)gc.fillText(x+'',x+2,10);
  for(let y=major;y<skGridCanvas.height;y+=major)gc.fillText(y+'',2,y-2);
}

function redrawGrid(){drawGrid();}
function getGridStep(){const s=document.getElementById('skGridSize');return s?parseInt(s.value)||0:20;}

// ── HISTORY ────────────────────────────────────────────────────────
function pushHistory(){
  skHistory.push(skCtx.getImageData(0,0,skCanvas.width,skCanvas.height));
  if(skHistory.length>60)skHistory.shift();
  updateUndoBtn();
}

function updateUndoBtn(){
  const btn=document.getElementById('sk-undo-btn');
  if(btn)btn.style.opacity=skHistory.length>1?'1':'.35';
}

function undoSketch(){
  if(skHistory.length<=1)return;
  skHistory.pop();
  skCtx.putImageData(skHistory[skHistory.length-1],0,0);
  updateUndoBtn();
}

// ── OPEN / CLOSE ───────────────────────────────────────────────────
function openSketch(pid,gid_,w,h){
  skPid=pid;skGid=gid_;skW=w;skH=h;
  skTexts=[];skTextLayer.innerHTML='';skHistory=[];skSelectedTxt=null;
  const wrap=document.getElementById('skCanvasWrap');
  const cw=Math.max(wrap.clientWidth||640,400);
  const ch=360; // fixed height so all sketches are same size
  skCanvas.width=cw;skCanvas.height=ch;
  skTextLayer.style.width=cw+'px';skTextLayer.style.height=ch+'px';
  skCtx.fillStyle='#fff';skCtx.fillRect(0,0,cw,ch);
  drawGrid();
  const p=projects.find(x=>x.id===pid);
  const g=p?.glasses.find(x=>x.id===gid_);
  if(g?.sketch){
    const img=new Image();
    img.onload=()=>{
      skCtx.clearRect(0,0,cw,ch);
      skCtx.fillStyle='#ffffff';skCtx.fillRect(0,0,cw,ch);
      // draw the saved sketch scaled to current canvas size
      skCtx.drawImage(img,0,0,cw,ch);
      skHistory=[];pushHistory();
    };
    img.src=g.sketch;
  } else {pushHistory();}
  document.getElementById('skDimsLabel').textContent='Peça: '+w+' × '+h+' mm';
  skModal.classList.add('open');
  setTool('draw');
  updateUndoBtn();
}

function closeSketch(){
  skModal.classList.remove('open');
  skHistory=[];skTexts=[];skTextLayer.innerHTML='';
}

function saveSketch(){
  const scale=2;
  const exp=document.createElement('canvas');
  exp.width=skCanvas.width*scale;exp.height=skCanvas.height*scale;
  const ec=exp.getContext('2d');
  ec.scale(scale,scale);
  // solid white background always
  ec.fillStyle='#ffffff';ec.fillRect(0,0,skCanvas.width,skCanvas.height);
  // draw grid lightly
  if(skGridCanvas){
    ec.save();ec.globalAlpha=0.4;ec.drawImage(skGridCanvas,0,0);ec.restore();
  }
  ec.drawImage(skCanvas,0,0);
  skTexts.forEach(t=>{
    const el=document.getElementById(t.id);if(!el)return;
    const wr=skTextLayer.getBoundingClientRect();
    const er=el.getBoundingClientRect();
    const cx=(er.left-wr.left)+er.width/2,cy=(er.top-wr.top)+er.height/2;
    const ang=(t.angle||0)*Math.PI/180;
    const lines=(el.innerText||t.text).split('\n');
    ec.save();ec.translate(cx,cy);ec.rotate(ang);
    ec.font=`bold ${t.fontSize}px Oswald,sans-serif`;
    ec.fillStyle=t.color;ec.textBaseline='top';
    const lh=t.fontSize+4,th=lines.length*lh;
    lines.forEach((ln,i)=>ec.fillText(ln,-er.width/2+4,-th/2+i*lh));
    ec.restore();
  });
  const url=exp.toDataURL('image/png');
  const p=projects.find(x=>x.id===skPid);
  if(p)p.glasses=p.glasses.map(g=>g.id===skGid?{...g,sketch:url}:g);
  persist();renderAll();closeSketch();
}

function clearCanvas(){
  skCtx.fillStyle='#fff';skCtx.fillRect(0,0,skCanvas.width,skCanvas.height);
  skTexts=[];skTextLayer.innerHTML='';
  skHistory=[];pushHistory();
}

// ── TOOLS ──────────────────────────────────────────────────────────
function setTool(t){
  skTool=t;
  ['draw','line','rect','tri','text','move','erase'].forEach(x=>{
    const el=document.getElementById('sk-tool-'+x);
    if(el)el.classList.toggle('active',x===t);
  });
  const hints={
    draw:'✏️ Desenhe livremente — clique e arraste',
    line:'📏 Clique e arraste para traçar uma reta',
    rect:'▭ Clique e arraste para desenhar um retângulo',
    tri:'△ Clique e arraste para desenhar um triângulo',
    text:'T Clique na tela para adicionar uma caixa de texto',
    move:'✥ Clique numa caixa de texto para selecioná-la e arraste para mover. Use A⁺/A⁻ para tamanho e ↺↻ para girar.',
    erase:'⬜ Apaga o que você desenhou — não afeta a grade nem os textos',
  };
  document.getElementById('skHintText').textContent=hints[t]||'';
  skCanvas.style.cursor=t==='erase'?'cell':t==='move'?'default':'crosshair';
  skTextLayer.style.pointerEvents=t==='move'?'auto':'none';
}

function setColor(c,el){
  skColor=c;
  document.querySelectorAll('.sk-color').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}

// ── TEXT BOXES ─────────────────────────────────────────────────────
function selectTxt(id){
  document.querySelectorAll('.sk-txt-box').forEach(d=>{
    d.style.outline='none';
    d.style.boxShadow='0 1px 4px rgba(0,0,0,.15)';
  });
  skSelectedTxt=id;
  if(!id)return;
  const div=document.getElementById(id);
  if(div){div.style.outline='2px solid #1a5fa8';div.style.boxShadow='0 0 0 3px rgba(26,95,168,.3)';}
}

function changeFontSize(d){
  if(!skSelectedTxt)return;
  const t=skTexts.find(t=>t.id===skSelectedTxt);if(!t)return;
  t.fontSize=Math.max(8,Math.min(120,t.fontSize+d));
  const div=document.getElementById(t.id);
  if(div){div.style.fontSize=t.fontSize+'px';div.style.minHeight=(t.fontSize+14)+'px';}
}

function rotateSelectedText(d){
  if(!skSelectedTxt)return;
  const t=skTexts.find(t=>t.id===skSelectedTxt);if(!t)return;
  t.angle=(t.angle||0)+d;
  const div=document.getElementById(t.id);
  if(div)div.style.transform=`rotate(${t.angle}deg)`;
}

function deleteSelectedText(){
  if(!skSelectedTxt)return;
  const div=document.getElementById(skSelectedTxt);
  if(div)div.remove();
  skTexts=skTexts.filter(t=>t.id!==skSelectedTxt);
  skSelectedTxt=null;
}

function addTextBox(x,y){
  const id='txt'+(++skTxtCnt);const fs=20;const color=skColor;
  const div=document.createElement('div');
  div.id=id;div.className='sk-txt-box';
  div.contentEditable='true';div.spellcheck=false;
  div.style.cssText=`position:absolute;left:${x}px;top:${y}px;min-width:70px;min-height:${fs+14}px;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:${fs}px;line-height:1.3;color:${color};
    background:rgba(255,255,255,.92);outline:2px solid #1a5fa8;border-radius:5px;
    padding:3px 7px;cursor:text;white-space:pre-wrap;word-break:break-word;max-width:300px;
    box-shadow:0 0 0 3px rgba(26,95,168,.3);pointer-events:auto;user-select:text;
    transform:rotate(0deg);transform-origin:center;touch-action:none;`;
  div.setAttribute('data-skid',id);div.setAttribute('data-color',color);

  let dragging=false,dragOx=0,dragOy=0;

  div.addEventListener('pointerdown',e=>{
    selectTxt(id);
    if(skTool!=='move')return;
    e.preventDefault();e.stopPropagation();
    dragging=true;
    div.setPointerCapture(e.pointerId);
    // offset = where inside the div the user clicked
    const dr=div.getBoundingClientRect();
    dragOx=e.clientX-dr.left;
    dragOy=e.clientY-dr.top;
    div.style.cursor='grabbing';
  });

  div.addEventListener('pointermove',e=>{
    if(!dragging)return;
    e.preventDefault();
    const wr=skTextLayer.getBoundingClientRect();
    // new top-left: pointer minus intra-div offset, relative to layer
    const nx=Math.max(0,Math.min(e.clientX-wr.left-dragOx, wr.width-20));
    const ny=Math.max(0,Math.min(e.clientY-wr.top-dragOy, wr.height-20));
    div.style.left=nx+'px';div.style.top=ny+'px';
    const t=skTexts.find(t=>t.id===id);
    if(t){t.x=nx;t.y=ny;}
  });

  div.addEventListener('pointerup',e=>{
    if(!dragging)return;
    dragging=false;
    div.releasePointerCapture(e.pointerId);
    div.style.cursor='text';
  });
  div.addEventListener('focus',()=>selectTxt(id));
  div.addEventListener('click',e=>{e.stopPropagation();selectTxt(id);});
  div.addEventListener('input',()=>{const t=skTexts.find(t=>t.id===id);if(t)t.text=div.innerText;});

  skTextLayer.appendChild(div);
  skTexts.push({id,x,y,text:'',color,fontSize:fs,angle:0});
  skSelectedTxt=id;
  setTimeout(()=>div.focus(),30);
  return div;
}

// ── DRAWING ────────────────────────────────────────────────────────
function getPos(e){
  const r=skCanvas.getBoundingClientRect();
  const s=e.touches?e.touches[0]:e;
  return{x:s.clientX-r.left,y:s.clientY-r.top};
}

function skDown(e){
  selectTxt(null);
  if(skTool==='text'){e.preventDefault();const{x,y}=getPos(e);addTextBox(x,y);return;}
  e.preventDefault();skDrawing=true;
  const{x,y}=getPos(e);skStartX=x;skStartY=y;
  if(skTool==='draw'||skTool==='erase'){skCtx.beginPath();skCtx.moveTo(x,y);}
  else skSnapshot=skCtx.getImageData(0,0,skCanvas.width,skCanvas.height);
}

function skMove(e){
  if(!skDrawing)return;e.preventDefault();
  const{x,y}=getPos(e);
  const sz=parseInt(document.getElementById('skSize').value)||3;
  if(skTool==='draw'){
    skCtx.strokeStyle=skColor;skCtx.lineWidth=sz;skCtx.lineCap='round';skCtx.lineJoin='round';
    skCtx.lineTo(x,y);skCtx.stroke();
  } else if(skTool==='erase'){
    skCtx.strokeStyle='#fff';skCtx.lineWidth=sz*6;skCtx.lineCap='round';
    skCtx.lineTo(x,y);skCtx.stroke();
  } else {
    skCtx.putImageData(skSnapshot,0,0);
    skCtx.strokeStyle=skColor;skCtx.lineWidth=sz;skCtx.lineCap='round';skCtx.beginPath();
    if(skTool==='line'){skCtx.moveTo(skStartX,skStartY);skCtx.lineTo(x,y);skCtx.stroke();}
    else if(skTool==='rect')skCtx.strokeRect(skStartX,skStartY,x-skStartX,y-skStartY);
    else if(skTool==='tri'){
      skCtx.moveTo(skStartX+(x-skStartX)/2,skStartY);
      skCtx.lineTo(x,y);skCtx.lineTo(skStartX,y);skCtx.closePath();skCtx.stroke();
    }
  }
}

function skUp(){
  if(!skDrawing)return;skDrawing=false;skCtx.beginPath();pushHistory();
}

skCanvas.addEventListener('mousedown',skDown);
skCanvas.addEventListener('mousemove',skMove);
skCanvas.addEventListener('mouseup',skUp);
skCanvas.addEventListener('mouseleave',skUp);
skCanvas.addEventListener('touchstart',skDown,{passive:false});
skCanvas.addEventListener('touchmove',skMove,{passive:false});
skCanvas.addEventListener('touchend',skUp);

// ── FIREBASE SYNC ──────────────────────────────────────────────
(function(){
  const FB_KEY = 'vidros_editor';

  // Push current localStorage data to Firebase
  window.__syncToCloud = function(){
    if(!navigator.onLine || !window.__fbSave) return;
    try{
      const raw = localStorage.getItem('vidros_proj_v5');
      if(raw) window.__fbSave(FB_KEY, JSON.parse(raw));
    }catch(e){}
  };

  // Patch ALL save functions to sync to cloud
  function _patchSaves(){
    // scheduleSave (Agenda apps)
    if(typeof scheduleSave==='function'){
      const _orig = scheduleSave;
      window.scheduleSave = function(){
        _orig();
        // sync after the save timer fires (~700ms)
        setTimeout(window.__syncToCloud, 900);
      };
    }
    // persist (VidrosEditor, BrasilPortas)
    if(typeof persist==='function'){
      const _orig = persist;
      window.persist = function(){
        _orig();
        window.__syncToCloud();
      };
    }
    // save (GestaoObras, Cronograma)
    if(typeof save==='function' && save.toString().includes('localStorage')){
      const _orig = save;
      window.save = function(){
        _orig();
        window.__syncToCloud();
      };
    }
    // saveAll
    if(typeof saveAll==='function'){
      const _orig = saveAll;
      window.saveAll = function(d){
        if(d!==undefined) _orig(d); else _orig();
        window.__syncToCloud();
      };
    }
  }

  // Load from Firebase on start
  function _fbInit(){
    if(!window.__fbLoad){ setTimeout(_fbInit, 200); return; }

    // Patch saves after DOM ready
    if(document.readyState==='loading')
      document.addEventListener('DOMContentLoaded', _patchSaves);
    else _patchSaves();

    window.__fbLoad('vidros_editor', function(data){
      if(!data) return;
      try{
        const local = localStorage.getItem('vidros_proj_v5');
        const localParsed = local ? JSON.parse(local) : null;
        const isEmpty = !localParsed ||
          (Array.isArray(localParsed) && !localParsed.length) ||
          (typeof localParsed==='object' && !Array.isArray(localParsed) && !Object.keys(localParsed).length);
        if(isEmpty){
          localStorage.setItem('vidros_proj_v5', JSON.stringify(data));
          if(typeof load==='function') load();
          if(typeof render==='function') render();
          else if(typeof renderAll==='function') renderAll();
          else if(typeof renderSB==='function'){
            renderSB();
            if(typeof renderContent==='function') renderContent();
          }
        }
      }catch(e){ console.warn('fbLoad error:',e); }
    });

    // Listen for changes from other devices (3s delay to avoid conflicts on load)
    let _ready = false;
    setTimeout(()=>_ready=true, 3000);
    window.__fbListen('vidros_editor', function(data){
      if(!_ready || !data) return;
      try{
        const incoming = JSON.stringify(data);
        const current = localStorage.getItem('vidros_proj_v5');
        if(incoming !== current){
          localStorage.setItem('vidros_proj_v5', JSON.stringify(data));
          if(typeof load==='function') load();
          if(typeof render==='function') render();
          else if(typeof renderAll==='function') renderAll();
          else if(typeof renderSB==='function'){
            renderSB();
            if(typeof renderContent==='function') renderContent();
          }
        }
      }catch(e){}
    });
  }

  if(window.__fbReady) _fbInit();
  else window.addEventListener('fbReady', _fbInit, {once:true});
})();
</script>
</body>
</html>
